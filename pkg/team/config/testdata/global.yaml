apiVersion: kuketeams.io/v1
kind: TeamsConfig
spec:
  defaults:
    sources:
      - name: kukeon
        url: github.com/eminwux/kukeon
        branch: main
    roles:
      - name: majordomo
        source: kukeon
        path: team/roles/majordomo
        needs:
          image: [go]
      - name: dev
        source: kukeon
        path: team/roles/dev
        harness: claude
    harnesses:
      - name: codex
        source: kukeon
        path: team/harnesses/codex
      - name: claude
        source: kukeon
        path: team/harnesses/claude
