apiVersion: v1beta1
kind: CellBlueprint
metadata:
  name: {{ .Name }}
  realm: {{ .Realm }}

{{- $isRoot := .Root }}
{{- $home := "/home/user" }}
spec:
  prefix: {{ .Name }}
  requires:
{{ yamlIndent 4 .Requires }}
  parameters:
{{ yamlIndent 4 .Parameters }}
  components:
{{ yamlIndent 4 .Components }}
  cell:
    tty:
      default: work
    {{- if $isRoot }}
    # Root cells run docker/containerd-in-cell; the nested cgroup runtime
    # delegates a cgroup subtree so an inner runtime can manage its own scopes.
    nestedCgroupRuntime: true
    {{- end }}
    containers:
      - id: work
        attachable: true
        image: "${IMAGE}"
        command: {{ .Shell }}
        workingDir: {{ $home }}
        {{- if $isRoot }}
        privileged: true
        {{- end }}
        env:
{{ yamlIndent 10 .Environment }}
        {{- if .Secrets }}
        secrets:
{{ yamlIndent 10 .Secrets }}
        {{- end }}
        volumes:
          {{- range .MountSelectors }}
          {{- template "host_mounts" . }}
          {{- end }}
          {{- if .StatePath }}
          # Harness state (logins, sessions). The Config names the volume, so a
          # role keeps its state across blueprint revisions.
          - kind: volume
            source: "${STATE_VOLUME}"
            target: {{ .StatePath }}
            ensure: true
          {{- end }}
          {{- range .Mounts }}
          - source: {{ .Source | quote }}
            target: {{ .Target | quote }}
            readOnly: {{ .ReadOnly }}
          {{- end }}
          {{- if $isRoot }}
          # CNI plugin binaries + conflists for the in-cell runtime's networking
          # (matches the retired crew dev-root mount; the daemon's own /opt/cni
          # binds target the kukeond cell, not workload cells).
          - source: /opt/cni
            target: /opt/cni
          {{- end }}
        {{- if $isRoot }}
        # Host rootfs is an overlay on sandboxed dev hosts; docker/containerd
        # cannot stack their overlay drivers on a host bind — back with tmpfs.
        tmpfs:
          - path: /var/lib/docker
            sizeBytes: 4294967296
          - path: /var/lib/containerd
            sizeBytes: 4294967296
        {{- end }}
        repos:
          # The Config fills each slot with a URL, a revision and, optionally,
          # that source's own git identity.
          - name: role-source
            target: "${ROLE_SOURCE_DIR}"
            required: true
          - name: project
            target: "${PROJECT_DIR}"
          {{- range .ExtraRepos }}
          - name: {{ .Name | quote }}
            target: {{ .Target | quote }}
          {{- end }}
        tty:
          prompt: {{ .Prompt | quote }}
          {{- if .OnInit }}
          onInit:
{{ template "onInit" .OnInit }}
          {{- end }}
