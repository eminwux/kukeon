apiVersion: kuketeams.io/v1
kind: Team
metadata: { name: kukeon-dev }
spec:
  sources:
    - name: agents
      url: git@github.com:eminwux/agents
      branch: main
      clonePath: /home/user/agents
  roles:
    - { name: dev, source: agents, path: dev, needs: { image: [go, root] } }
    - { name: pm, source: agents, path: pm }
    - { name: pr-reviewer, source: agents, path: pr-reviewer }
  # Harness definitions, contexts and image catalogs live in this repository
  # (harnesses/); `project` is the source `kuke team add` adds for it.
  harnesses:
    - { name: claude, source: project, path: harnesses/claude }
    - { name: codex, source: project, path: harnesses/codex }
