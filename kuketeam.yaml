apiVersion: kuketeams.io/v1
kind: Team
metadata: { name: kukeon-dev }
spec:
  sources:
    - name: agents
      url: github.com/eminwux/agents
      branch: main
      clonePath: /home/user/agents
    - name: kuketeams
      url: github.com/eminwux/kuketeams
      branch: main
      clonePath: /home/user/kuketeams
  roles:
    - { name: dev, source: agents, path: dev, needs: { image: [go, root] } }
    - { name: pm, source: agents, path: pm }
    - { name: pr-reviewer, source: agents, path: pr-reviewer }
  harnesses:
    - { name: claude, source: kuketeams, path: harnesses/claude }
    - { name: codex, source: kuketeams, path: harnesses/codex }
