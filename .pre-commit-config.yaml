# `pre-commit install` installs both hook types (#1642): every hook runs at
# commit time, and the golangci-lint hook also runs before a push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Vite output is checked byte-for-byte by web-ui-check.
        exclude: ^internal/webui/dist/
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
        # *.tmpl.yaml are Go text/template sources, not YAML documents.
        exclude: ^(examples/profiles/local\.yaml|.*\.tmpl\.ya?ml)$
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.6.2
    hooks:
      - id: golangci-lint
        # Build the hook with go 1.26.6 (the root and cmd/kukebuild `go`
        # directive). v2.6.2's own go.mod floor is go 1.24, so without this the
        # hook is compiled by whatever older Go is on PATH and refuses to load
        # the go 1.26 module ("the Go language version (go1.24) used to build
        # golangci-lint is lower than the targeted Go version"). Rebuilding the
        # same release keeps the formatter output identical to the lint.yaml
        # gate; newer releases reflow thousands of existing lines.
        language_version: 1.26.6
        # cmd/kukebuild lives in its own Go module (#662 module split). Disable
        # workspace mode so the hook only sees the root module; cmd/kukebuild
        # stays unlinted by pre-commit (#693).
        #
        # --new-from-merge-base origin/main reports issues on every line the
        # branch changes, committed or not. The previous --new-from-rev HEAD
        # saw only uncommitted changes, so a run after committing (`pre-commit
        # run --files ...` before a push, or the pre-push stage) reported
        # nothing (#1642). Fetch origin/main first so the merge base is
        # current.
        #
        # No --fix: the --new-from-* flags only filter which issues are
        # reported, but --fix re-runs the formatters (golines, gofumpt, gci)
        # over every touched file, rewriting lines outside the branch's diff
        # and detaching trailing //nolint directives from the line they
        # suppress (#1455). Report-only keeps the hook scoped to the
        # contributor's own changes; fix reported lines by hand.
        entry: env GOWORK=off golangci-lint run --new-from-merge-base origin/main
        args: ["./..."]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(md|json|yml|yaml)$
        # *.tmpl.yaml are Go text/template sources that render to YAML;
        # prettier cannot parse the template directives.
        exclude: ^(ROADMAP\.md|.*\.tmpl\.ya?ml)$

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        files: \.go$
        args:
          ["-c", "Emiliano Spinella (eminwux)", "-l", "apache", "-s", "*.go"]
