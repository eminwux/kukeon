# User-owned workspace manifest. Project repositories and their revisions are
# declared as sources; teams select the sources and integrations they use.
apiVersion: kukeworkspace.io/v1
kind: Workspace
metadata:
  name: developer-workspace
spec:
  sources:
    - name: primary-agents
      repo: github.com/eminwux/agents
      ref: v1.4.0
      path: model1
    - name: kukeon
      repo: github.com/eminwux/kukeon
      ref: main
    - name: sbsh
      repo: github.com/eminwux/sbsh
      ref: main

  credentials:
    - name: github-cli-token
      secretRef: workspace-github-cli-token
    - name: github-ssh-key
      secretRef: workspace-github-ssh-key
      volumeMount:
        target: /home/agent/.ssh/id_ed25519
        readOnly: true

  teams:
    - name: kukeon
      sources:
        # Clone the kukeon source into the team container's ./kukeon path.
        - { name: kukeon, path: kukeon }
      cwd: kukeon
      integrations:
        gh:
          credentials: [github-cli-token]
        git:
          credentials: [github-ssh-key]
      harnesses:
        - { name: claude, source: primary-agents, path: harnesses/claude }
        - {
            name: codex,
            source: primary-agents,
            path: harnesses/codex,
            default: true,
          }
      agents:
        - {
            name: dev,
            source: primary-agents,
            path: dev,
            harness: claude,
            needs: { image: [go] },
          }
        - { name: rev, source: primary-agents, path: pr-reviewer }

    - name: sbsh-development
      sources:
        # Clone the sbsh source into the team container's ./sbsh path.
        - { name: sbsh, path: sbsh }
      cwd: $HOME/sbsh
      integrations:
        gh:
          credentials: [github-cli-token]
        git:
          credentials: [github-ssh-key]
      harnesses:
        - {
            name: claude,
            source: primary-agents,
            path: harnesses/claude,
            default: true,
          }
        - { name: codex, source: primary-agents, path: harnesses/codex }
      agents:
        - {
            name: dev,
            source: primary-agents,
            path: dev,
            harness: claude,
            needs: { image: [go] },
          }
        - { name: rev, source: primary-agents, path: pr-reviewer }

    - name: orchestrator
      integrations:
        gh:
          credentials: [github-cli-token]
        git:
          credentials: [github-ssh-key]
      cwd: $HOME
      harnesses:
        - {
            name: claude,
            source: primary-agents,
            path: harnesses/claude,
            default: true,
          }
        - { name: codex, source: primary-agents, path: harnesses/codex }
      agents:
        - { name: root, source: primary-agents, path: orchestrator }

# Runtime observations are reported separately from desired spec:
# status:
#   configs: 3
#   blueprints: 2
#   runningCells: 4
