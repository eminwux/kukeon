# User-owned workspace manifest. Project repositories and their revisions are
# declared as sources; teams select the sources and integrations they use.
apiVersion: kukeworkspace.io/v1
kind: Workspace
metadata:
  name: developer-workspace
spec:
  sources:
    - name: primary-agents
      repo: eminwux/agents
      ref: v1.4.0
      path: model1
    - name: kukeon
      repo: eminwux/kukeon
      ref: main
    - name: sbsh
      repo: eminwux/sbsh
      ref: main

  credentials:
    - name: github-cli-token
      secretRef: workspace-github-cli-token
    - name: github-ssh-key
      secretRef: workspace-github-ssh-key
      volumeMount:
        target: /home/agent/.ssh/id_ed25519
        readOnly: true

  teams:
    - name: development
      sources: [kukeon]
      cwd: /home/kukeon
      config:
        integrations:
          github:
            gh:
              credentials: [github-cli-token]
            git:
              credentials: [github-ssh-key]
      spec:
        defaults: { harnesses: [claude, codex] }
        roles:
          - { source: primary-agents, path: dev, needs: { image: [go] } }
          - { source: primary-agents, path: pr-reviewer }
    - name: sbsh-development
      sources: [sbsh]
      cwd: /home/sbsh
      config: {}
      spec:
        defaults: { harnesses: [claude] }
        roles:
          - { source: primary-agents, path: dev, needs: { image: [go] } }

    - name: orchestrator
      cwd: /home/kuke
      config: {}
      spec:
        roles:
          - { source: primary-agents, path: orchestrator, instances: 2 }
        workspaceCell:
          configs:
            - name: workspace-orchestrator
              blueprint: workspace-orchestrator
              values: { WORKSPACE: developer-workspace }

# Runtime observations are reported separately from desired spec:
# status:
#   configs: 3
#   blueprints: 2
#   runningCells: 4
