# User-owned workspace manifest. Project paths are absolute paths on the host
# running `kuke workspace init`; they are locators, not paths mounted into cells.
apiVersion: kukeworkspace.io/v1
kind: Workspace
metadata:
  name: developer-workspace
spec:
  sources:
    - name: primary-agents
      repo: eminwux/agents
      ref: v1.4.0
      path: model1

  credentials:
    - name: github-cli-token
      secretRef: workspace-github-cli-token
    - name: github-ssh-key
      secretRef: workspace-github-ssh-key
      volumeMount:
        target: /home/agent/.ssh/id_ed25519
        readOnly: true

  projects:
    - name: kukeon
      repo: eminwux/kukeon
      path: /home/alice/src/kukeon
      integrations:
        github:
          gh:
            credentials: [github-cli-token]
          git:
            credentials: [github-ssh-key]
    - name: sbsh
      repo: eminwux/sbsh
      path: /home/alice/src/sbsh

  teams:
    - project: kukeon
      metadata: { name: development }
      spec:
        source: { repo: eminwux/agents, ref: v1.4.0 }
        defaults: { harnesses: [claude, codex] }
        roles:
          - { ref: dev, needs: { image: [go] } }
          - { ref: pr-reviewer }
    - project: sbsh
      metadata: { name: sbsh-development }
      spec:
        source: { repo: eminwux/agents, ref: v1.4.0 }
        defaults: { harnesses: [claude] }
        roles:
          - { ref: dev, needs: { image: [go] } }

    - metadata: { name: orchestrator }
      spec:
        source: { repo: eminwux/agents, ref: v1.4.0 }
        roles:
          - { ref: orchestrator, instances: 2 }
        workspaceCell:
          configs:
            - name: workspace-orchestrator
              blueprint: workspace-orchestrator
              values: { WORKSPACE: developer-workspace }
      agentSource: primary-agents

# Runtime observations are reported separately from desired spec:
# status:
#   configs: 3
#   blueprints: 2
#   runningCells: 4
