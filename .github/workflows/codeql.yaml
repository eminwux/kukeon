name: CodeQL (weekly)

# Code scanning on a weekly schedule instead of on every pull request and
# push. GitHub's CodeQL "default setup" ran four analyses (about three minutes,
# the Go one longest) on every PR and every merge, and its per-ref dependency
# caches (450-700 MB each) were the largest consumers of the repository's
# 10 GB Actions cache limit.
#
# Default setup and a workflow file cannot both upload results: while default
# setup is enabled, the analyze step here fails with "CodeQL analyses from
# advanced configurations cannot be processed when the default setup is
# enabled". Turn default setup off under Settings → Code security → Code
# scanning (or `gh api -X PATCH repos/<owner>/<repo>/code-scanning/default-setup
# -f state=not-configured`) when this file reaches main.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # GOWORK is left unset on purpose: with go.work in effect the autobuild
      # covers the cmd/kukebuild module as well as the root module, as default
      # setup did. cache: false sidesteps the cache-restore clash test.yaml
      # documents for setup-go under go.work (#1572).
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
