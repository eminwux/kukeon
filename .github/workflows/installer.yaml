name: Installer

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/install.sh"
      - "docs/site/install.sh"
      - "Makefile"
      - ".github/workflows/installer.yaml"
  push:
    branches:
      - main
    paths:
      - "scripts/install.sh"
      - "docs/site/install.sh"
      - "Makefile"
      - ".github/workflows/installer.yaml"

# A new push to a pull request cancels the run for the previous push. Runs on
# main are keyed on their commit and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check that runs on the hosted runner itself is a step of this one
  # job: each takes a few seconds, and one job per check spent more time
  # starting runners than checking. The steps are ordered so the ones that
  # must leave /usr/local/bin untouched run before the one that installs.
  # `if: ${{ !cancelled() }}` keeps the later steps running after an earlier
  # one fails, so one run still reports every broken check.
  runner:
    name: sync, --check, rejected inputs and a full install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The canonical script lives at scripts/install.sh; docs/site/install.sh
      # is the copy mkdocs publishes at https://kukeon.io/install.sh.
      # `make install.sh` re-renders the copy; this catches contributors who
      # edited one and forgot to rerun the make target.
      - name: scripts/install.sh and docs/site/install.sh are in sync
        run: |
          make install.sh
          if ! git diff --exit-code docs/site/install.sh; then
            echo "::error::docs/site/install.sh is stale. Run 'make install.sh' and commit the result."
            exit 1
          fi

      # Positive path: the GitHub-hosted ubuntu-latest runner already runs
      # containerd (Docker is preinstalled and live), which is the only daemon
      # the installer checks for. Validates AC: "`bash install.sh --check` runs
      # prereq checks only and exits without touching the system."
      - name: --check passes with prereqs installed
        if: ${{ !cancelled() }}
        run: |
          if [ ! -S /run/containerd/containerd.sock ]; then
            echo "::error::containerd socket missing on the runner — runner image changed?"
            exit 1
          fi
          bash scripts/install.sh --check
          if [ -e /usr/local/bin/kuke ]; then
            echo "::error::installer --check touched /usr/local/bin/kuke"
            exit 1
          fi

      # Negative path: an unknown KUKE_CHANNEL is rejected with exit 2 before
      # the prerequisite checks touch anything (issue #1638). The edge install
      # itself is smoked by edge.yaml after each publish: nothing in a PR can
      # exercise the `edge` prerelease before the edge workflow has run on main.
      - name: an unknown KUKE_CHANNEL exits 2 and installs nothing
        if: ${{ !cancelled() }}
        run: |
          set +e
          out="$(KUKE_CHANNEL=nightly bash scripts/install.sh 2>&1)"
          rc=$?
          echo "$out"
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 for KUKE_CHANNEL=nightly, got ${rc}"
            exit 1
          fi
          if ! echo "$out" | grep -q 'KUKE_CHANNEL'; then
            echo "::error::expected the failure message to name KUKE_CHANNEL"
            exit 1
          fi
          if [ -e /usr/local/bin/kuke ]; then
            echo "::error::installer touched /usr/local/bin/kuke despite an invalid channel"
            exit 1
          fi

      # Negative path: a temporary directory too small for the release assets
      # (#1343). The installer must fail before or during the download with a
      # message that names TMPDIR, not one that sends the operator looking for
      # a missing release. The runner has sudo and a running containerd.
      - name: a full TMPDIR is reported as that, not as a missing release
        if: ${{ !cancelled() }}
        run: |
          sudo mkdir -p /mnt/kuke-small
          sudo mount -t tmpfs -o size=1m,mode=1777 tmpfs /mnt/kuke-small
          set +e
          out="$(TMPDIR=/mnt/kuke-small KUKE_VERSION=v0.6.1 KUKE_SKIP_INIT=1 bash scripts/install.sh 2>&1)"
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::expected non-zero exit with a full TMPDIR"
            exit 1
          fi
          if ! echo "$out" | grep -q 'TMPDIR'; then
            echo "::error::expected the failure message to name TMPDIR"
            exit 1
          fi
          if echo "$out" | grep -q 'Confirm KUKE_VERSION'; then
            echo "::error::a local write failure must not suggest a missing release"
            exit 1
          fi

      # End-to-end smoke, last because it is the one step that installs:
      # download real release binaries, install them to /usr/local/bin, and
      # skip the kuke-init step (which would need root, cgroup writes, and a
      # healthy containerd). Pinned to a known-good tag so the test doesn't
      # drift with future releases. v0.6.1 ships kuke, kukebuild, and kukepause
      # assets plus their .sha256 sums, so this exercises the full multi-binary
      # download + checksum-verify + install path (no KUKE_SKIP_CHECKSUM, no
      # KUKE_SKIP_KUKEBUILD). kukepause is fetched unconditionally because
      # `kuke init` cannot bootstrap without it (issue #1241).
      - name: full install (KUKE_SKIP_INIT=1) against a real release
        if: ${{ !cancelled() }}
        env:
          KUKE_VERSION: v0.6.1
          KUKE_SKIP_INIT: "1"
        run: |
          bash scripts/install.sh
          test -x /usr/local/bin/kuke
          test -x /usr/local/bin/kukeond
          test -x /usr/local/bin/kukebuild
          test -x /usr/local/bin/kukepause
          /usr/local/bin/kuke version

  # Negative path: minimal container with no containerd installed, which is
  # why this check keeps a job of its own. The script
  # must report which prereq is missing, print a distro-aware hint, and exit
  # non-zero. Validates AC: "On a fresh host without containerd, the script
  # exits with a distro-aware install hint and non-zero status."
  prereq-missing:
    name: --check fails cleanly without containerd
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bash + curl (script dependencies)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash curl ca-certificates
      - name: Run installer --check on an unprepared host
        run: |
          set +e
          out="$(bash scripts/install.sh --check 2>&1)"
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::expected non-zero exit on a host without prereqs"
            exit 1
          fi
          # The hint must name containerd specifically — generic "something
          # missing" output would defeat the AC.
          if ! echo "$out" | grep -q 'containerd'; then
            echo "::error::expected the failure message to reference containerd"
            exit 1
          fi
          # No files should be touched on the prereq-failure path.
          if [ -e /usr/local/bin/kuke ]; then
            echo "::error::installer touched /usr/local/bin/kuke despite prereq failure"
            exit 1
          fi
