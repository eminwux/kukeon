name: Test
on:
  pull_request:
    branches:
      - main
    # Skip on changes that can't affect Go build/test/e2e outcomes (docs-only
    # PRs, mkdocs site edits, release tooling, etc.). `make e2e` builds the
    # repo root Dockerfile with kukebuild and runs Go binaries produced from
    # the Makefile, so both stay in the trigger set alongside `**/*.go` and
    # the module files. The workflow self-reference ensures CI
    # edits to this file still run their own job.
    #
    # `internal/webui/**` is deliberately absent: frontend source and the
    # generated dist/ bundle are covered by the `Embedded web UI` job in
    # webui.yaml. No Go test outside internal/webui imports the package and
    # the e2e suite never asserts on embedded asset bytes, so a frontend-only
    # PR has nothing for these jobs to catch. Go files under internal/webui/
    # still trigger this workflow through `**/*.go`.
    paths:
      - "**/*.go"
      - "cmd/kuke/apply/testdata/**"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - "Dockerfile"
      - ".github/workflows/test.yaml"
  # There is no `push` trigger: on main these jobs run as the `test` job of
  # edge.yaml, which publishes the edge build only when they pass. A second
  # run from a push trigger here would test the same commit twice.
  workflow_call:

# A new push to a pull request cancels the run for the previous push. A run
# called from edge.yaml is keyed on its commit and is never cancelled.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both jobs only check out the repo and run tests — no PR comments, no
# release artifacts, no remote pushes. The minimal read-only default
# scopes the GITHUB_TOKEN to what `actions/checkout` needs and silences
# the CodeQL `actions/missing-workflow-permissions` finding raised on
# this PR's introduction of the e2e job.
permissions:
  contents: read

# GOWORK=off matches the Makefile's `export GOWORK := off`. It also has to be
# visible to actions/setup-go: the action runs `go env` in the repo root before
# restoring its cache, and with go.work in effect, a go.work `go` line ahead of
# go.mod's makes the installed toolchain download the newer one into
# GOMODCACHE first (#1572 hit this with go1.24.5 vs go.work's go1.25.5). The cached
# tarball holds the same read-only toolchain files, so the restore then fails
# with thousands of `Cannot open: File exists` errors, is treated as a miss,
# and every run re-saves a fresh cache (#1572).
env:
  GOWORK: "off"

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Split per Go module so a red run names the failing component in the
      # step status (issue #696): root-module unit tests vs. the standalone
      # cmd/kukebuild module. Both still run on every PR/push; GOWORK=off is
      # preserved by the Makefile's top-level export, so neither step re-couples
      # the workspace-union import graph.
      - name: Run root-module tests
        run: make test-root

      - name: Run daemon tests under the race detector
        run: make test-race

      - name: Run kukebuild module tests
        run: make test-kukebuild

  # `make e2e` needs two host prerequisites — root, and a standalone
  # containerd at /run/containerd/containerd.sock (the target kukebuild
  # writes the local kukeond image into and the bootstrap target for
  # `kuke init`, distinct from the docker-private containerd socket at
  # /var/run/docker/containerd/containerd.toml). No docker daemon is needed.
  # Mirrors the local-dev contract documented in AGENTS.md and
  # docs/site/install/build-from-source.md. Runs in parallel with the unit
  # job above (no shared resources).
  e2e:
    name: make e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Override systemd-resolved with a static /etc/resolv.conf pointing at
      # public recursors. GH ubuntu-latest runners route DNS through
      # systemd-resolved at 127.0.0.53, which has been observed to drop UDP
      # responses under bursty parallel load — the e2e suite's parallel image
      # pulls hit registry-1.docker.io and ghcr.io from many
      # workers simultaneously, surfacing as 20s `read udp 127.0.0.1:NNN->
      # 127.0.0.53:53: i/o timeout` errors from containerd's image fetcher
      # (observed on this PR's first green-everything-else run).
      # `options timeout:2 attempts:3` caps a failed query at 6s so we fail
      # fast rather than re-burning 20s on every parallel pull if both
      # upstreams ever go away together.
      - name: Use static public DNS (bypass systemd-resolved)
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          cat <<'EOF' | sudo tee /etc/resolv.conf > /dev/null
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          nameserver 1.0.0.1
          options timeout:2 attempts:3
          EOF
          getent hosts registry-1.docker.io > /dev/null
          getent hosts ghcr.io > /dev/null

      - name: Ensure standalone containerd is running
        run: |
          sudo systemctl start containerd
          test -S /run/containerd/containerd.sock

      # The e2e suite runs every workload command through the in-process
      # controller (via the `--run-path` promotion in buildKukeRunPathArgs),
      # which shells out to host-side CNI plugins at /opt/cni/bin — see
      # docs/site/install/prerequisites.md §"CNI plugins (for in-process mode
      # only)". Install the upstream containernetworking/plugins tarball to
      # match that contract; the Debian/Ubuntu apt package lands at
      # /usr/lib/cni and would miss the path kukeon's CNI manager probes.
      - name: Install CNI plugins to /opt/cni/bin
        env:
          CNI_VERSION: v1.4.1
        run: |
          sudo mkdir -p /opt/cni/bin
          curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_VERSION}/cni-plugins-linux-amd64-${CNI_VERSION}.tgz" \
            | sudo tar -C /opt/cni/bin -xz
          test -x /opt/cni/bin/bridge
          test -x /opt/cni/bin/host-local
          test -x /opt/cni/bin/loopback
          test -x /opt/cni/bin/portmap

      # The kukeon-group e2e tests (TestKuke_RunFromStopped_*_NoEACCES, the
      # #916/#918 bind-time socket mode + GID regression guards) resolve the
      # `kukeon` system group via user.LookupGroup and skip when it is
      # absent. The harness's per-test `kuke init --run-path <tmp>` does not
      # create host groups, so provision it here — idempotently, matching
      # what `kuke init` does on a real host — so they run on CI (#1447).
      - name: Create kukeon system group
        run: |
          getent group kukeon > /dev/null || sudo groupadd --system kukeon
          getent group kukeon

      # `sudo env "PATH=$PATH" ...` re-injects the runner's PATH past sudoers'
      # secure_path so the actions/setup-go toolchain stays resolvable when
      # the Makefile invokes `go test` as root. (`sudo -E` is not used: the
      # runner's sudoers rejects it with "preserving the entire environment
      # is not supported, '-E' is ignored".)
      #
      # GOCACHE and GOMODCACHE are passed the same way so root reuses the
      # module and build cache actions/setup-go restored for the `runner`
      # user. Without them root falls back to its own empty caches,
      # re-downloads every module (plus any newer toolchain) and compiles
      # every package from scratch (#1572).
      #
      # step-level timeout-minutes (vs. the implicit 360 min job default) is
      # the diagnostic safety net: when a child of `go test` (e.g. an orphan
      # containerd-shim or a hung CNI invocation) holds the runner's
      # stdout/stderr pipe open past `go test`'s own exit, GitHub flushes
      # the in-progress step's log only on step completion. A cancellation
      # drops the buffer; a timeout-induced failure persists it. 20 min is
      # ~10× the historical build+test phase wall-clock and bounds the
      # blast radius without flagging legitimately slow runs.
      #
      # `stdbuf -oL -eL` forces line-buffered stdout/stderr so each `go test
      # -v` PASS/FAIL line streams to the runner log immediately, instead
      # of waiting for libc's 4 KiB pipe-buffer flush — without this, a
      # stall mid-test shows as silence even though tests were progressing.
      #
      # `</dev/null` detaches stdin so the runner doesn't wait on it, and
      # `> >(cat) 2> >(cat >&2)` re-parents stdout/stderr through fresh
      # process-substitution pipes that close when `make` itself exits.
      # Without this, a containerd-shim or CNI helper that inherits the
      # step's stdout/stderr pipes keeps them open after `go test` returns,
      # and GitHub Actions waits for those FDs to close before marking the
      # step done — that's how a 67s test run becomes a 60+ min "hang"
      # that not even `timeout-minutes` escapes.
      - name: Run e2e suite as root
        timeout-minutes: 20
        run: |
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          stdbuf -oL -eL sudo env "PATH=$PATH" "GOCACHE=$GOCACHE" "GOMODCACHE=$GOMODCACHE" make e2e </dev/null > >(cat) 2> >(cat >&2)

      # Root wrote new entries into the runner's GOCACHE/GOMODCACHE above.
      # Hand them back to `runner` so the `Post Set up Go` cache save, which
      # runs as `runner`, is not tripped up by root-owned files or
      # directories when this job wins the save (a `go.sum` change or the
      # first run after the cache key changes).
      - name: Return Go caches to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"
