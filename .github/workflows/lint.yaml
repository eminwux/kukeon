name: Lint
on:
  pull_request:
    branches:
      - main
    # Formatter drift can only come from Go sources or the formatter config;
    # Makefile holds the `fmt-check` recipe the job runs.
    # Kept out of test.yaml so a .golangci.yml-only change runs this check
    # without paying for `make test` / `make e2e`. The workflow
    # self-reference ensures CI edits to this file still run their own job.
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/lint.yaml"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on
# main are keyed on their commit and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Matches the pre-commit hook's `env GOWORK=off` and the Makefile's
# `export GOWORK := off`.
env:
  GOWORK: "off"
  # Keep in lockstep with the golangci-lint `rev` in .pre-commit-config.yaml:
  # a different release can format the same source differently, and the hook
  # and this gate would then disagree.
  GOLANGCI_LINT_VERSION: v2.6.2

jobs:
  fmt:
    name: golangci-lint fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # golangci-lint is built from source with the Go set up above (go.mod's
      # go 1.26.6): the prebuilt v2.6.2 binary is built with an older Go and
      # refuses to load a go 1.26 module. The build takes about a minute, so
      # the binary is cached under a key that names both versions and is
      # rebuilt only when one of them changes.
      - name: Restore the golangci-lint binary
        id: golangci-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build golangci-lint
        if: steps.golangci-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/go/bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      # Formatters only (golines, gci, gofumpt from .golangci.yml); the full
      # `golangci-lint run` stays in the pre-commit hook (#1501). The check
      # lives in `make fmt-check` so contributors run exactly this gate
      # locally (#1642); it fails on a non-zero exit (config or parse error)
      # or on any diff output.
      - name: Check formatting
        run: |
          "$HOME/go/bin/golangci-lint" version
          if ! make fmt-check GOLANGCI_LINT="$HOME/go/bin/golangci-lint"; then
            echo "::error::golangci-lint formatters would change the files above. Run 'GOWORK=off golangci-lint fmt ./...' (${GOLANGCI_LINT_VERSION}) and commit the result."
            exit 1
          fi
