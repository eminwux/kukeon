name: Lint
on:
  pull_request:
    branches:
      - main
    # Formatter drift can only come from Go sources or the formatter config.
    # Kept out of test.yaml so a .golangci.yml-only change runs this check
    # without paying for `make test` / `make e2e`. The workflow
    # self-reference ensures CI edits to this file still run their own job.
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".golangci.yml"
      - ".github/workflows/lint.yaml"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - ".golangci.yml"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

# Matches the pre-commit hook's `env GOWORK=off` and the Makefile's
# `export GOWORK := off`.
env:
  GOWORK: "off"

jobs:
  fmt:
    name: golangci-lint fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Keep in lockstep with the golangci-lint `rev` in .pre-commit-config.yaml:
      # a different release can format the same source differently, and the
      # hook and this gate would then disagree. `goinstall` builds it with the
      # Go set up above (go.mod's go 1.26.6): the prebuilt v2.6.2 binary is
      # built with an older Go and refuses to load a go 1.26 module.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          install-mode: goinstall
          install-only: true

      # Formatters only (golines, gci, gofumpt from .golangci.yml); the full
      # `golangci-lint run` stays in the pre-commit hook (#1501). `fmt` walks
      # files rather than loading packages, so ./... also covers the separate
      # cmd/kukebuild module. Fail on a non-zero exit (config or parse error)
      # or on any diff output.
      - name: Check formatting
        run: |
          set +e
          out="$(golangci-lint fmt --diff ./... 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::golangci-lint formatters would change the files above. Run 'GOWORK=off golangci-lint fmt ./...' (v2.6.2) and commit the result."
            exit 1
          fi
