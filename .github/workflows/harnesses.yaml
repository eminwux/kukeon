name: Harnesses
on:
  pull_request:
    branches:
      - main
    # Runs `make test-harnesses` only when something the kuke team harness
    # images depend on changes, so Go-only PRs elsewhere skip it. The paths:
    #   - team/harnesses/**: Harness definitions, image build contexts and
    #     Dockerfiles, release catalogs, build/release scripts, the
    #     cmd/images plan generator and the Python tests.
    #   - internal/team/harnessassets/**: the Go catalog/build-closure test
    #     test-harnesses runs.
    #   - internal/team/harnessbuild/** and pkg/team/harness/**: the Bake plan
    #     and catalog generation build-images.sh and release-images.sh call.
    #   - team/team.mk: the test-harnesses target itself.
    # Root-module Go tests (including the packages above) still run in
    # test.yaml. The workflow self-reference ensures CI edits to this file
    # still run their own job.
    paths:
      - "team/harnesses/**"
      - "internal/team/harnessassets/**"
      - "internal/team/harnessbuild/**"
      - "pkg/team/harness/**"
      - "team/team.mk"
      - ".github/workflows/harnesses.yaml"
  push:
    branches:
      - main
    paths:
      - "team/harnesses/**"
      - "internal/team/harnessassets/**"
      - "internal/team/harnessbuild/**"
      - "pkg/team/harness/**"
      - "team/team.mk"
      - ".github/workflows/harnesses.yaml"

# The job only checks out the repo and runs checks (no image push; the
# build plan runs in MODE=check), so a read-only GITHUB_TOKEN is enough.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push. Runs on
# main are keyed on their commit and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-harnesses:
    name: make test-harnesses
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # build-images.sh prints the resolved Bake plan with
      # `docker buildx bake --print`; nothing is built or pushed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run harness checks
        run: make test-harnesses
