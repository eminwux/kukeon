apiVersion: kuketeams.io/v1
kind: HarnessImageCatalog
metadata:
  name: opencode
spec:
  images:
    - image: ghcr.io/eminwux/kukeon/opencode:v0.10.0
      capabilities:
        - opencode
        - git
        - gh
        - go
        - node
        - make
    - image: ghcr.io/eminwux/kukeon/opencode-root:v0.10.0
      capabilities:
        - opencode
        - git
        - gh
        - go
        - node
        - make
        - root
