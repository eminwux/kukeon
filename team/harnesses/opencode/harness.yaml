apiVersion: v1beta1
kind: Harness
metadata:
  name: opencode
spec:
  renderer: kukeon/v1beta1
  shell: /bin/bash
  environment:
    OPENCODE_CONFIG: "${HOME}/.opencode-config"
    OPENROUTER_MODEL: "${OPENROUTER_MODEL}"
    AGENT_DEF_DIR: "${ROLE_SOURCE_DIR}/${ROLE_PATH}"
    SHARED_AGENT_DIR: "${ROLE_SOURCE_DIR}/common"
    OPENCODE_PERMISSIONS: "${PERMISSIONS}"
  parameters:
    - name: OPENROUTER_MODEL
      default: openrouter/qwen/qwen3.7-max
  # Secret slots available in every mode. A role fills one by naming it.
  secrets:
    - name: openrouter-api-key
      envName: OPENROUTER_API_KEY
  # The mode is picked per cell at create time (`--mode`), so one role config
  # serves both an attached session and a dispatched run.
  modes:
    interactive:
      description: Attachable session.
      onInit:
        - script: |
            set -eu
            make -f /opt/kuketeams/harness/Makefile.start setup

            cd "$INITIAL_PATH" || exit 1
            exec opencode --model "$OPENROUTER_MODEL" ./
    headless:
      description: Dispatched, unattended run of one prompt.
      parameters:
        - name: PROMPT
          required: true
          description: Prompt the run starts from.
      onInit:
        - script: |
            set -eu
            set --
            if [ "$OPENCODE_PERMISSIONS" = skip ]; then set -- --dangerously-skip-permissions; fi
            make -f /opt/kuketeams/harness/Makefile.start setup

            cd "$INITIAL_PATH" || exit 1
            exec opencode run "$PROMPT" "$@" --model "$OPENROUTER_MODEL" -f ./
  skillPath: $HOME/.agents/skills
  images:
    - name: opencode
      build:
        context: harnesses/opencode/context
        dockerfile: Dockerfile
      capabilities: [opencode, git, gh, go, node, make]
    - name: opencode-root
      build:
        context: harnesses/opencode/context
        dockerfile: Dockerfile.root
      capabilities: [opencode, git, gh, go, node, make, root]
