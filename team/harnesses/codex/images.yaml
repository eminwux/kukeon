apiVersion: v1beta1
kind: HarnessImageCatalog
metadata:
  name: codex
spec:
  images:
    - image: ghcr.io/eminwux/kukeon/codex:v0.10.0
      capabilities:
        - codex
        - git
        - gh
        - go
        - node
        - make
    - image: ghcr.io/eminwux/kukeon/codex-root:v0.10.0
      capabilities:
        - codex
        - git
        - gh
        - go
        - node
        - make
        - root
