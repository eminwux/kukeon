apiVersion: kuketeams.io/v1
kind: Role
metadata:
  name: majordomo
spec:
  skills:
    - team/roles/majordomo/skills/create-cell-config
    - team/roles/majordomo/skills/diagnose
    - team/roles/majordomo/skills/file-kukeon-bug
    - team/roles/majordomo/skills/health-sweep
    - team/roles/majordomo/skills/observe-cell
  harnesses:
    claude:
      settings: config/claude.settings.json
    codex:
      sandbox: workspace-write
      approval: on-request
    opencode:
      permissions: ask
      secrets:
        - openrouter-api-key
  needs:
    image:
      - go
    mounts:
      - kukeond-socket
      - kuke-binary
  tasks:
    - name: health-sweep
      skill: health-sweep
      schedule: "@hourly"
      suspend: true
